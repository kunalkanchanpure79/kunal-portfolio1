<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kunal | Developer Portfolio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
    font-family:Arial, sans-serif;
}

body{
    background:#050816;
    color:#fff;
    overflow-x:hidden;
}

/* Background */
body::before{
    content:"";
    position:fixed;
    width:400px;
    height:400px;
    background:#00e5ff;
    filter:blur(150px);
    opacity:.12;
    top:-100px;
    left:-100px;
    z-index:-1;
}

body::after{
    content:"";
    position:fixed;
    width:400px;
    height:400px;
    background:#8b5cf6;
    filter:blur(150px);
    opacity:.12;
    bottom:-100px;
    right:-100px;
    z-index:-1;
}

/* Navbar */
nav{
    position:fixed;
    top:0;
    width:100%;
    padding:18px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(5,8,22,.75);
    backdrop-filter:blur(15px);
    z-index:1000;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#00e5ff;
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    transition:.3s;
}

nav ul li a:hover{
    color:#00e5ff;
}

.menu{
    display:none;
    font-size:28px;
    cursor:pointer;
}

/* Sections */
section{
    padding:100px 8%;
}

.home{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding-top:130px;
}

.home h1{
    font-size:clamp(40px,8vw,75px);
    animation:fadeUp 1s ease;
}

.home h1 span{
    color:#00e5ff;
}

.home h2{
    margin:15px 0;
    color:#aaa;
    font-size:clamp(20px,4vw,32px);
}

.home p{
    max-width:650px;
    margin:auto;
    color:#bbb;
    line-height:1.7;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:13px 28px;
    border-radius:30px;
    background:#00e5ff;
    color:#001014;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
    box-shadow:0 0 25px rgba(0,229,255,.35);
}

.btn:hover{
    transform:translateY(-5px) scale(1.03);
    box-shadow:0 0 35px rgba(0,229,255,.6);
}

/* Titles */
.title{
    text-align:center;
    font-size:40px;
    margin-bottom:50px;
}

.title span{
    color:#00e5ff;
}

/* About */
.about-box{
    max-width:850px;
    margin:auto;
    padding:35px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    backdrop-filter:blur(10px);
    line-height:1.8;
    color:#ccc;
}

/* Skills */
.skills{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:20px;
}

.skill{
    padding:25px;
    text-align:center;
    border-radius:18px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    transition:.4s;
}

.skill:hover{
    transform:translateY(-10px);
    border-color:#00e5ff;
    box-shadow:0 10px 30px rgba(0,229,255,.15);
}

.skill h3{
    margin-bottom:10px;
    color:#00e5ff;
}

/* Projects */
.projects{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    padding:30px;
    border-radius:20px;
    background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.1);
    transition:.4s;
}

.card:hover{
    transform:translateY(-12px);
    border-color:#8b5cf6;
    box-shadow:0 15px 40px rgba(139,92,246,.15);
}

.card h3{
    color:#00e5ff;
    margin-bottom:15px;
}

.card p{
    color:#aaa;
    line-height:1.6;
}

.card a{
    display:inline-block;
    margin-top:20px;
    color:#fff;
    text-decoration:none;
}

/* Education */
.education{
    max-width:800px;
    margin:auto;
}

.edu{
    padding:25px;
    margin-bottom:20px;
    border-left:3px solid #00e5ff;
    background:rgba(255,255,255,.04);
    border-radius:0 15px 15px 0;
}

.edu h3{
    color:#00e5ff;
    margin-bottom:8px;
}

.contact{
    text
